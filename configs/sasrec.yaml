data:
  dir: data/ml-1m
  min_interactions: 5

model:
  name: sasrec
  max_len: 200
  d: 64
  n_layers: 2
  n_heads: 2
  dropout: 0.2
  use_position: true

training:
  loss: cross_entropy
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0
  max_epochs: 200
  early_stopping_patience: 5
  n_seeds: 3

evaluation:
  k: 10
  n_negatives: 100
  batch_size: 256

output:
  dir: runs
